<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bhumit Lukhi — Application Developer with 4+ years building Flutter & Android apps: JoinMuse (USA), Dasher robotic delivery (UAE), Spice Money Cash Deposit (India), Medigo and EasyMeds.">
  <meta name="theme-color" content="#05060F">
  <meta property="og:title" content="Bhumit Lukhi — Application Developer">
  <meta property="og:description" content="4+ years shipping production Flutter & Android apps across the USA, UAE and India.">
  <meta property="og:type" content="website">

  <title>Bhumit Lukhi — Application Developer</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">

  <!-- Flutter downloads its renderer (CanvasKit) and fallback fonts from these hosts. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Start downloading fonts + hero photo while the engine boots. -->
  <link rel="preload" href="assets/assets/fonts/web/Poppins-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/web/Poppins-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/web/Poppins-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/web/Poppins-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/imgs/profile.jpg" as="fetch" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #05060F; }

    #loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      padding: 24px; box-sizing: border-box; text-align: center;
      background: radial-gradient(circle at 30% 30%, rgba(254, 83, 187, .14), transparent 45%),
                  radial-gradient(circle at 70% 70%, rgba(9, 251, 211, .12), transparent 45%),
                  #05060F;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .5s ease, transform .5s ease;
    }
    #loader.done { opacity: 0; transform: scale(1.04); pointer-events: none; }

    /* Phone mockup with app tiles "installing" one after another.
       Every animated property here is transform/opacity, so these run on the
       compositor and keep moving even while the main thread is busy compiling
       the engine — the whole point of having a splash at all. */
    .phone {
      position: relative; width: 92px; height: 176px; border-radius: 20px;
      border: 3px solid rgba(255, 255, 255, .85);
      box-shadow: 0 0 40px rgba(9, 251, 211, .25), inset 0 0 18px rgba(254, 83, 187, .15);
      animation: float 2.4s ease-in-out infinite;
      will-change: transform;
    }
    .phone::before {
      content: ""; position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
      width: 26px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .6);
    }
    .grid {
      position: absolute; inset: 24px 12px 18px; display: grid;
      grid-template-columns: repeat(3, 1fr); gap: 7px; align-content: start;
    }
    .grid span {
      aspect-ratio: 1; border-radius: 6px;
      background: linear-gradient(135deg, #aa367c, #4a2fbd);
      opacity: 0; transform: scale(.3);
      animation: pop 2.4s cubic-bezier(.34, 1.56, .64, 1) infinite;
    }
    .grid span:nth-child(3n+2) { background: linear-gradient(135deg, #09FBD3, #33BBCF); }
    .grid span:nth-child(4n)   { background: linear-gradient(135deg, #FE53BB, #aa367c); }
    .grid span:nth-child(1) { animation-delay: .00s } .grid span:nth-child(2) { animation-delay: .12s }
    .grid span:nth-child(3) { animation-delay: .24s } .grid span:nth-child(4) { animation-delay: .36s }
    .grid span:nth-child(5) { animation-delay: .48s } .grid span:nth-child(6) { animation-delay: .60s }
    .grid span:nth-child(7) { animation-delay: .72s } .grid span:nth-child(8) { animation-delay: .84s }
    .grid span:nth-child(9) { animation-delay: .96s }

    .brand { color: #fff; font-size: 20px; font-weight: 300; letter-spacing: .5px; }
    .brand b { font-weight: 600; background: linear-gradient(90deg, #09FBD3, #FE53BB);
               -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand .caret { display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -2px;
                    background: #09FBD3; animation: blink 1s steps(1) infinite; }

    /* Determinate: the bar reflects real boot milestones, so a slow mobile
       connection reads as "still working" rather than "stuck". */
    .bar { width: 180px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, .12); }
    .bar > i {
      display: block; width: 100%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #09FBD3, #FE53BB);
      transform: scaleX(0); transform-origin: left;
      transition: transform .45s ease-out;
    }
    .hint { color: rgba(255, 255, 255, .5); font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; }

    #loader-retry { display: none; flex-direction: column; align-items: center; gap: 14px; }
    #loader-retry.show { display: flex; }
    #loader-retry p { margin: 0; max-width: 300px; color: rgba(255, 255, 255, .6);
                      font-size: 13px; line-height: 1.6; letter-spacing: 0; text-transform: none; }
    #loader-retry button {
      padding: 11px 22px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(9, 251, 211, .5); background: rgba(9, 251, 211, .08);
      color: #09FBD3; font: inherit; font-size: 13px; font-weight: 600;
    }

    @keyframes pop {
      0% { opacity: 0; transform: scale(.3) }
      15%, 80% { opacity: 1; transform: scale(1) }
      100% { opacity: 0; transform: scale(.6) }
    }
    @keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes blink { 50% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .phone, .grid span, .caret { animation: none; }
      .grid span { opacity: 1; transform: none; }
      #loader { transition: none; }
    }
  </style>
</head>
<body>
  <div id="loader" role="progressbar" aria-label="Loading portfolio">
    <div class="phone"><div class="grid">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div></div>
    <div class="brand">&lt; <b>Bhumit Lukhi</b> /&gt;<span class="caret"></span></div>
    <div class="bar"><i id="loader-bar"></i></div>
    <div class="hint" id="loader-hint">Loading</div>
    <div id="loader-retry">
      <p id="loader-error">This is taking longer than usual — the first visit downloads the renderer.</p>
      <button type="button" id="loader-reload">Reload</button>
    </div>
  </div>

  <script>
    // Splash controller.
    //
    // Inline and dependency-free on purpose: it has to keep working in exactly
    // the cases where flutter_bootstrap.js does not (blocked CDN, failed wasm
    // compile, out-of-memory tab). It only ever gets dismissed by Dart's first
    // post-frame callback — or, failing that, by the visitor.
    (function () {
      var loader = document.getElementById('loader');
      var hint = document.getElementById('loader-hint');
      var bar = document.getElementById('loader-bar');
      var retry = document.getElementById('loader-retry');
      var error = document.getElementById('loader-error');
      var done = false;
      var started = Date.now();

      document.getElementById('loader-reload').addEventListener('click', function () {
        location.reload();
      });

      // The bar only ever moves forward: real milestones and the idle crawl
      // below both feed through here, so neither can rewind the other.
      var progress = 0;
      function at(fraction, text) {
        if (done) return;
        if (fraction > progress) {
          progress = fraction;
          bar.style.transform = 'scaleX(' + fraction + ')';
        }
        if (text) hint.textContent = text;
      }

      // Boot milestones, reported by flutter_bootstrap.js.
      window.__flutterStage = at;

      // Called by Dart from its first post-frame callback: the only moment we
      // know for certain that there is something behind the splash to see.
      window.__flutterAppReady = function () {
        if (done) return;
        done = true;
        clearInterval(crawl);
        bar.style.transform = 'scaleX(1)';
        loader.classList.add('done');
        setTimeout(function () { loader.remove(); }, 550);
      };

      // Start-up reported a failure. Not every rejection is fatal — a service
      // worker or an analytics request can reject while the app boots fine —
      // so give the app a few more seconds to paint before blaming it.
      window.__flutterBootFailed = function (e) {
        if (done) return;
        console.error('Flutter failed to start', e);
        setTimeout(function () {
          if (done) return;
          retry.classList.add('show');
          hint.textContent = "Couldn't start";
          error.textContent =
            'The app failed to load in this browser. A reload usually fixes it.';
          clearInterval(crawl);
        }, 4000);
      };

      // While we are waiting on the network, creep the bar forward so the page
      // never looks frozen, and offer a way out once the wait is unreasonable.
      var crawl = setInterval(function () {
        if (done) return;
        var secs = (Date.now() - started) / 1000;
        // Asymptotic: approaches ~0.9 but never claims to be finished.
        at(0.9 * (1 - Math.exp(-secs / 9)));
        if (secs > 6 && secs < 18) hint.textContent = 'Downloading renderer';
        if (secs > 18) {
          hint.textContent = 'Almost there';
          retry.classList.add('show');
        }
      }, 700);

      window.addEventListener('error', function (e) {
        if (e && e.target && e.target.tagName === 'SCRIPT') {
          window.__flutterBootFailed(e);
        }
      }, true);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
